[package]
name = "rustPS4"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"

members = [
    "crates/*",
]

[dependencies]
ps4_core = { package = "core", path = "crates/core" }
gpu = { path = "crates/gpu" }
input = { path = "crates/input" }
kernel = { path = "crates/kernel" }
libraries = { path = "crates/libraries" }
loader = { path = "crates/loader" }
memory = { path = "crates/memory" }
